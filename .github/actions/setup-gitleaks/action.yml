name: Setup gitleaks
description: Install the pinned gitleaks binary
inputs:
  version:
    description: gitleaks release version
    default: '8.30.1'
  sha256:
    description: SHA-256 of the Linux x64 release archive
    default: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
outputs:
  gitleaks:
    description: Path to the gitleaks binary
    value: ${{ steps.install.outputs.gitleaks }}
runs:
  using: composite
  steps:
    - name: Install gitleaks
      id: install
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.version }}
        GITLEAKS_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        destination="$RUNNER_TEMP/gitleaks"
        mkdir -p "$destination"
        curl --fail --location --silent --show-error \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          --output "$RUNNER_TEMP/gitleaks.tar.gz"
        echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$destination"
        echo "gitleaks=$destination/gitleaks" >> "$GITHUB_OUTPUT"
